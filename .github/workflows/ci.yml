name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  cpp-tests:
    name: Native C++ tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/test
      - name: Test
        run: ctest --test-dir build/test --output-on-failure

  firmware-build:
    name: Firmware build (host layer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - name: Build firmware application layer (native env)
        # Compiles and links the whole portable firmware layer (controller +
        # app + core) with the PlatformIO toolchain.
        run: pio run -e native
      - name: Smoke-run the host binary
        run: .pio/build/native/program
      # Device environments build one at a time: pio package installs are not
      # safe to run concurrently against a shared ~/.platformio.
      - name: Build X4 firmware
        run: pio run -e xteink_x4
      - name: Build X3 firmware
        run: pio run -e xteink_x3
      - name: Upload X4 artefact
        uses: actions/upload-artifact@v4
        with:
          name: habitink-xteink_x4-firmware
          path: .pio/build/xteink_x4/firmware.bin
          if-no-files-found: error
      - name: Upload X3 artefact
        uses: actions/upload-artifact@v4
        with:
          name: habitink-xteink_x3-firmware
          path: .pio/build/xteink_x3/firmware.bin
          if-no-files-found: error

  companion-tests:
    name: Companion tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install companion with test extras
        run: pip install -e "./companion[test]"
      - name: Run pytest
        run: pytest companion

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        # Generated assets are excluded; they are machine-written wide tables.
        run: |
          files=$(find lib src test -name '*.cpp' -o -name '*.h' \
            | grep -vE 'Font8x13.cpp|Icons.cpp')
          clang-format-18 --dry-run --Werror $files
