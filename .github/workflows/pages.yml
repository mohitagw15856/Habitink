name: flash-page

# Publishes docs/flash (the ESP Web Tools installer) plus a freshly built
# firmware.bin and the two otadata images to GitHub Pages on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
      - run: pip install --upgrade platformio
      - name: Build firmware (one binary serves X3 and X4)
        run: pio run -e xteink_x3
      - name: Assemble site
        run: |
          mkdir -p _site
          cp docs/flash/* _site/
          cp .pio/build/xteink_x3/firmware.bin _site/Habitink.bin
          python3 tools/make_otadata.py _site
          ls -l _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
