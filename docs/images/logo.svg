<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="900" height="240" role="img" aria-label="HabitInk">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1e24"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a208"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="900" height="240" rx="28" fill="url(#bg)"/>

  <!-- pixel confetti -->
  <g fill="#2a2e37">
    <rect x="600" y="28" width="10" height="10" rx="2"/>
    <rect x="640" y="52" width="10" height="10" rx="2"/>
    <rect x="820" y="40" width="10" height="10" rx="2"/>
    <rect x="855" y="150" width="10" height="10" rx="2"/>
    <rect x="590" y="185" width="10" height="10" rx="2"/>
    <rect x="700" y="205" width="10" height="10" rx="2"/>
  </g>

  <!-- e-ink device -->
  <g filter="url(#soft)">
    <rect x="48" y="48" width="168" height="144" rx="16" fill="#23262d"/>
    <rect x="60" y="60" width="144" height="120" rx="8" fill="#f4f3ec"/>
    <!-- mini contribution grid -->
    <g>
      <rect x="72" y="72" width="16" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="94" y="72" width="16" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="116" y="72" width="16" height="16" rx="3" fill="#cfcfc4"/>
      <rect x="138" y="72" width="16" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="160" y="72" width="16" height="16" rx="3" fill="#cfcfc4"/>
      <rect x="72" y="94" width="16" height="16" rx="3" fill="#cfcfc4"/>
      <rect x="94" y="94" width="16" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="116" y="94" width="16" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="138" y="94" width="16" height="16" rx="3" fill="#1a1a1a"/>
      <rect x="160" y="94" width="16" height="16" rx="3" fill="#cfcfc4"/>
    </g>
    <!-- big amber tick -->
    <path d="M78 140 l20 22 l40 -52" fill="none" stroke="url(#amber)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="256" y="118" font-size="72" font-weight="800" fill="#ffffff" letter-spacing="-1">Habit<tspan fill="url(#amber)">Ink</tspan></text>
    <text x="260" y="158" font-size="26" font-weight="600" fill="#9aa0ab" letter-spacing="1">habits that stare back from your desk</text>
    <!-- pills -->
    <g font-size="20" font-weight="700">
      <rect x="260" y="178" width="96" height="34" rx="17" fill="#2a2e37"/>
      <text x="308" y="201" fill="#ffd166" text-anchor="middle">wake</text>
      <rect x="364" y="178" width="84" height="34" rx="17" fill="#2a2e37"/>
      <text x="406" y="201" fill="#ffd166" text-anchor="middle">tap</text>
      <rect x="456" y="178" width="110" height="34" rx="17" fill="#2a2e37"/>
      <text x="511" y="201" fill="#ffd166" text-anchor="middle">sleep</text>
      <text x="584" y="201" fill="#5b616c">&#8635; in &lt;10s</text>
    </g>
  </g>
</svg>
