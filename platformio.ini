; HabitInk firmware build configuration.
;
; Two environments:
;   native  - host build of the portable firmware layer (controller + app +
;             core) against a headless Hal. This is what CI compiles: it needs
;             only a C++ toolchain, no ESP32 SDK, and proves the on-device
;             application code builds and links.
;   xteink  - the real ESP32-C3 firmware for the Xteink X4/X3, built on the
;             freeink-sdk. See docs/HARDWARE_TESTING.md for the on-device
;             verification steps; the SDK-facing adapters are marked
;             TODO(hardware-test).
;
; PlatformIO auto-discovers the libraries under lib/ (HabitCore, HabitUI).

[platformio]
default_envs = native

[habitink]
version = 0.1.0

[env:native]
platform = native
build_flags =
  -std=gnu++17
  -I.
  -DHABITINK_VERSION=\"${habitink.version}\"
; Only compile the portable controller and the headless host entry; the
; freeink adapters and the Arduino entry are device-only.
build_src_filter =
  +<HabitInkController.cpp>
  +<platform/native/native_main.cpp>

[env:xteink]
; ESP32-C3, matching the Xteink X4/X3 that CrossPoint targets.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
build_flags =
  -std=gnu++17
  -I.
  -DHABITINK_VERSION=\"${habitink.version}\"
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -fno-exceptions
build_unflags =
  -std=gnu++11
build_src_filter =
  +<*>
  -<platform/native/>
; The device build needs the freeink-sdk plus the ecosystem HAL wrapper layer
; (HalDisplay / HalStorage / HalGPIO). Provide them via a submodule or lib_deps
; when building for hardware; see docs/HARDWARE_TESTING.md.
; lib_deps =
;   https://github.com/Free-Ink/freeink-sdk.git
