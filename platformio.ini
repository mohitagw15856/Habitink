; HabitInk firmware build configuration.
;
; Environments:
;   native     - host build of the portable firmware layer (controller + app +
;                core) against a headless Hal. Needs only a C++ toolchain and
;                proves the on-device application code builds and links.
;   xteink_x4  - the real ESP32-C3 firmware, device layer supplied entirely by
;                inkkit (pinned tag below); no freeink-sdk submodules/symlinks.
;   xteink_x3  - identical firmware; inkkit's HAL detects X4 vs X3 at runtime.
;                Two envs so each target ships a named .bin artifact.
;
; PlatformIO auto-discovers the libraries under lib/ (HabitCore, HabitUI).
;
; Note: run pio environments one at a time (pio run -e <env>); concurrent pio
; invocations race on the shared ~/.platformio package directory.

[platformio]
default_envs = native

[habitink]
version = 0.1.0

[env:native]
platform = native
build_flags =
  -std=gnu++17
  -I.
  -DHABITINK_VERSION=\"${habitink.version}\"
; Only compile the portable controller and the headless host entry; the
; freeink adapters and the Arduino entry are device-only.
build_src_filter =
  +<HabitInkController.cpp>
  +<platform/native/native_main.cpp>

[device_base]
; ESP32-C3, matching the Xteink X4/X3 that CrossPoint targets. The complete
; device layer (HAL + vendored SDK hardware libraries) comes from inkkit.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 4MB
board_build.partitions = partitions.csv
build_flags =
  -std=gnu++2a
  -I.
  -DHABITINK_VERSION=\"${habitink.version}\"
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -fno-exceptions
build_unflags =
  -std=gnu++11
build_src_filter =
  +<*>
  -<platform/native/>
lib_deps =
  ; Canonical inkkit pin: the complete device layer (HAL + vendored SDK).
  https://github.com/mohitagw15856/inkkit.git#v0.1.0-rc1

[env:xteink_x4]
extends = device_base

[env:xteink_x3]
extends = device_base
